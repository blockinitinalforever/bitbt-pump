server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bitbt.fun;

    ssl_certificate /etc/letsencrypt/live/bitbt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitbt.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 30s;

    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":"Request body too large","code":"PAYLOAD_TOO_LARGE"}';
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    location = / {
        return 301 https://bitbt.fun/pump;
    }

    location /_next/static/ {
        alias /opt/bitbt-pump-web/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bitbt.fun;

    ssl_certificate /etc/letsencrypt/live/bitbt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitbt.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    return 301 https://bitbt.fun$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitbt.fun www.bitbt.fun;
    return 301 https://bitbt.fun$request_uri;
}
