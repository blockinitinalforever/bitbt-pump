server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bitbt.fun;

    ssl_certificate /etc/letsencrypt/live/bitbt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitbt.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 301 https://bitbt.fun/en/pump;
    }

    location /_next/static/ {
        alias /opt/bitbt-pump-web/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bitbt.fun;

    ssl_certificate /etc/letsencrypt/live/bitbt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitbt.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bitbt.fun$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitbt.fun www.bitbt.fun;
    return 301 https://bitbt.fun$request_uri;
}
