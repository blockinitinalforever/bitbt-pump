[package]
name = "bitbt-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "bitbt_api"
path = "src/lib.rs"

[[bin]]
name = "bootstrap_admin"
path = "src/bin/bootstrap_admin.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "migrate"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
cookie = "0.18"
http = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
